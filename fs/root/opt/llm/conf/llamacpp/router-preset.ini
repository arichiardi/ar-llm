version = 1

[*]
stop-timeout = 3600

reasoning-budget = 2048
reasoning-budget-message = " -- Reasoning budget exceeded, proceed to final answer."

batch-size = 4096
ubatch-size = 512

n-gpu-layers = 999

jinja = true

metrics = true

kv-unified = true

cache-type-k = q8_0
cache-type-v = q8_0

fa = on

load-mode = none
load-on-startup = false

[LFM3-Omni-2B]
alias = liquid/LFM3-Omni-2B
model = /var/lib/llm/models/llamacpp/LiquidAI/LFM3-Omni-2B-GGUF/LFM3-Omni-2B-BF16.gguf
mmproj = /var/lib/llm/models/llamacpp/LiquidAI/LFM3-Omni-2B-GGUF/mmproj-LFM3-Omni-2B-BF16.gguf
mmproj-offload = true

fit = true

reasoning = off

temp = 0.0
top-p = 1.0
top-k = 1
min-p = 0.0
repeat-penalty = 1.0

[LFM2.5-24B-A2B]
alias = liquid/LFM2.5-24B-A2B
model = /var/lib/llm/models/llamacpp/LiquidAI/LFM2.5-24B-A2B-GGUF/LFM2.5-24B-A2B-QAD-Q4_0.gguf
fit = true

n-cpu-moe = 26

temp = 0.1
top-k = 50
repeat-penalty = 1.05
