# llama-swap fragment: puffin (remote host) engines.
# Loaded after 00-base.yaml, which defines the puffin-polystrata macro.

models:

  ############ PolyStrata on puffin, 13434 ############
  # Public IDs, always listed. PolyStrata serves one engine per port and
  # ignores the request model field, so no useModelName is needed. A missing
  # name works exactly like the engine's own ID.

  "qwen/qwen3.8-flash-next":
    name: "Qwen3.8-Flash-Next"
    description: "Qwen3.8-Flash-Next IQ3_S, 2-part split GGUF, image + text (PolyStrata)"
    cmd: ${hold}
    proxy: ${puffin-polystrata}
    modalities: [image]
    # Same as above: puffin runs the engine, so forward at once and do not
    # pool connections to a PolyStrata that closes after each stream.
    checkEndpoint: none
    disableKeepAlives: true
    ttl: 0
