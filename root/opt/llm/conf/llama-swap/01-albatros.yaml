# llama-swap fragment: albatros (this host) engines.
# Loaded after 00-base.yaml, which defines the macros used here.

models:

  ############ llama.cpp router, 10434 ############
  # One entry per model, both unlisted. Clients use the public IDs
  # `alba-ai/LFM2.5-24B-A2B` and `alba-ai/LFM3-Omni-2B`, which the active
  # profile pins to these. useModelName sends the public alias upstream, since
  # the pin rewrote it to the internal ID.

  "alba-llamacpp/LFM2.5-24B-A2B":
    name: "LFM2.5-24B-A2B QAD-Q4_0"
    description: "LiquidAI MoE, llama.cpp router, resident at startup"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-llamacpp}
    useModelName: alba-ai/LFM2.5-24B-A2B
    # The engine is owned by its own unit, not by llama-swap, so do not
    # wait on /health: mark ready and forward. A down engine then fails the
    # request immediately instead of after healthCheckTimeout (60s).
    checkEndpoint: none
    # llama-server advertises keep-alive and closes after a streamed response
    # (llama-swap issue #1205), which shows up as 502 proxy error: EOF on the
    # next request. Do not pool connections to it.
    disableKeepAlives: true
    ttl: 0

  "alba-llamacpp/LFM3-Omni-2B":
    name: "LFM3-Omni-2B BF16"
    description: "LiquidAI omni 2B with vision, llama.cpp router"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-llamacpp}
    useModelName: alba-ai/LFM3-Omni-2B
    # The engine is owned by its own unit, not by llama-swap, so do not
    # wait on /health: mark ready and forward. A down engine then fails the
    # request immediately instead of after healthCheckTimeout (60s).
    checkEndpoint: none
    # llama-server advertises keep-alive and closes after a streamed response
    # (llama-swap issue #1205), which shows up as 502 proxy error: EOF on the
    # next request. Do not pool connections to it.
    disableKeepAlives: true
    ttl: 0

  ############ Gemma 4 26B-A4B, one engine at a time ############
  # One entry per engine, both unlisted. Clients use the public ID
  # `alba-ai/gemma4-moe`, which the active profile pins to one of these. Do not
  # wait on /health: the engine is owned by its own unit, not by llama-swap, so
  # a stopped or loading engine fails the request at once instead of waiting.

  "alba-ikllama/gemma4-moe":
    name: "Gemma 4 MoE"
    description: "Gemma 4 26B-A4B QAT q4_0 + MTP draft + vision (ik_llama)"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-ikllama}
    checkEndpoint: none
    disableKeepAlives: true
    ttl: 0

  "alba-polystrata/gemma4-moe":
    name: "Gemma 4 MoE"
    description: "Gemma 4 26B-A4B UD-Q3_K_M + vision (PolyStrata)"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-polystrata}
    checkEndpoint: none
    disableKeepAlives: true
    ttl: 0

# Public IDs: `alba-ai/LFM2.5-24B-A2B`, `alba-ai/LFM3-Omni-2B` and
# `alba-ai/gemma4-moe`. The three engines are mutually exclusive, so each
# profile enables its own models and disables the others. Switch the profile
# when you switch engines; no client change:
#   curl -X PUT http://127.0.0.1:20434/api/profiles/active -d '{"name":"alba-polystrata"}'
profiles:
  alba-llamacpp:
    pins:
      "alba-ai/LFM2.5-24B-A2B": "alba-llamacpp/LFM2.5-24B-A2B"
      "alba-ai/LFM3-Omni-2B": "alba-llamacpp/LFM3-Omni-2B"
      "alba-ai/gemma4-moe": ~
  alba-ikllama:
    pins:
      "alba-ai/LFM2.5-24B-A2B": ~
      "alba-ai/LFM3-Omni-2B": ~
      "alba-ai/gemma4-moe": "alba-ikllama/gemma4-moe"
  alba-polystrata:
    pins:
      "alba-ai/LFM2.5-24B-A2B": ~
      "alba-ai/LFM3-Omni-2B": ~
      "alba-ai/gemma4-moe": "alba-polystrata/gemma4-moe"

hooks:
  on_startup:
    profile: alba-polystrata
