# llama-swap fragment: albatros (this host) engines.
# Loaded after 00-base.yaml, which defines the macros used here.

models:

  ############ llama.cpp router, 10434 ############
  # Public IDs, always listed. useModelName sends the engine's own model name.

  "liquid/LFM2.5-24B-A2B":
    name: "LFM2.5-24B-A2B"
    description: "LiquidAI MoE QAD-Q4_0, llama.cpp router, resident at startup"
    cmd: ${hold}
    proxy: ${local-llamacpp}
    useModelName: LFM2.5-24B-A2B
    # The engine is owned by its own unit, not by llama-swap, so do not
    # wait on /health: mark ready and forward. A down engine then fails the
    # request immediately instead of after healthCheckTimeout (60s).
    checkEndpoint: none
    # The engine advertises keep-alive but closes after a streamed response
    # (llama-swap issue #1205), which shows up as 502 proxy error: EOF on the
    # next request. Do not pool connections to it.
    disableKeepAlives: true
    ttl: 0

  "liquid/LFM3-Omni-2B":
    name: "LFM3-Omni-2B"
    description: "LiquidAI omni 2B BF16 with vision, llama.cpp router"
    cmd: ${hold}
    proxy: ${local-llamacpp}
    useModelName: LFM3-Omni-2B
    # The engine is owned by its own unit, not by llama-swap, so do not
    # wait on /health: mark ready and forward. A down engine then fails the
    # request immediately instead of after healthCheckTimeout (60s).
    checkEndpoint: none
    # The engine advertises keep-alive but closes after a streamed response
    # (llama-swap issue #1205), which shows up as 502 proxy error: EOF on the
    # next request. Do not pool connections to it.
    disableKeepAlives: true
    ttl: 0

  ############ Gemma 4 26B-A4B, one engine at a time ############
  # One entry per engine, both unlisted. `google/gemma4-moe` is a profile pin.
  # Do not wait on /health: the engine is owned by its own unit, not by
  # llama-swap, so a stopped or loading engine fails at once instead of waiting.

  "alba-ikllama/gemma4-moe":
    name: "Gemma 4 MoE"
    description: "Gemma 4 26B-A4B QAT q4_0 + MTP draft + vision (ik_llama)"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-ikllama}
    checkEndpoint: none
    disableKeepAlives: true
    ttl: 0

  "alba-polystrata/gemma4-moe":
    name: "Gemma 4 MoE"
    description: "Gemma 4 26B-A4B UD-Q3_K_M + vision (PolyStrata)"
    unlisted: true
    cmd: ${hold}
    proxy: ${local-polystrata}
    checkEndpoint: none
    disableKeepAlives: true
    ttl: 0

# Only `google/gemma4-moe` switches engine with the profile.
#   curl -X PUT http://127.0.0.1:20434/api/profiles/active -d '{"name":"alba-polystrata"}'
profiles:
  alba-ikllama:
    pins:
      "google/gemma4-moe": "alba-ikllama/gemma4-moe"
  alba-polystrata:
    pins:
      "google/gemma4-moe": "alba-polystrata/gemma4-moe"

hooks:
  on_startup:
    profile: alba-polystrata
