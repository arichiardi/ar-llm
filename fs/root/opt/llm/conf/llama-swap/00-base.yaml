# llama-swap base: settings and macros shared by every host fragment.

# Never unload on idle. Engines stay resident once loaded; llama-swap starts
# them on demand and stops them only on explicit unload or shutdown.
globalTTL: 0
unloadTimeout: 10

# Managed engines block in /health while the model loads. 600s covers a cold
# 26B GGUF load on a consumer GPU.
healthCheckTimeout: 600

sendLoadingState: true

logLevel: info
# Valid: proxy, upstream, http, both, none, or a comma separated list.
logToStdout: proxy

security:
  cors:
    allowedOrigins:
      - "https://ai.albaforge.com"

macros:
  # Holder for externally-managed engines (remote peers).
  "hold": sleep infinity

  # Wrapper that talks to the llm user's systemd instance.
  "systemctl": /opt/llm/bin/llm-systemctl

  "local-llamacpp": http://127.0.0.1:10434
  "local-llamacpp-omni": http://127.0.0.1:10435
  "local-ikllama": http://127.0.0.1:11434
  "local-polystrata": http://127.0.0.1:13434
  "puffin-polystrata": http://puffin.home.arpa:13434
